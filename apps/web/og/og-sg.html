<!doctype html>
<!--
  Source of public/og-sg.png (1200×630). Regenerate with `bun run og:sg` in apps/web.
  Photo: "Chicken Rice Singapore" from Wikimedia Commons, CC0 (og/chicken-rice.jpg).
  Numbers: a real JoyoRogo scan of that photo (POST /ai/scan-anon, x-locale: en, 2026-11-03): white rice 200 g 260 kcal,
  roasted chicken 150 g 330 kcal, clear soup 30, chili sauce 60, sweet soy sauce 11; total 691 kcal, protein 43 g,
  carbs 66 g, fat 27 g.
-->
<html lang="en-SG">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-weight: 200 800;
        src: url("../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2")
          format("woff2");
      }
      :root {
        --background: oklch(0.975 0.008 85);
        --foreground: oklch(0.22 0.012 85);
        --muted: oklch(0.5 0.014 85);
        --card: oklch(1 0 0);
        --makan: oklch(0.52 0.13 152);
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-columns: 1fr 600px;
        gap: 48px;
        align-items: center;
        padding: 0 64px 0 80px;
        background: var(--background);
        color: var(--foreground);
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .logo {
        height: 48px;
      }
      h1 {
        margin-top: 36px;
        font-size: 64px;
        line-height: 1.03;
        font-weight: 800;
        letter-spacing: -0.035em;
      }
      .lead {
        margin-top: 20px;
        font-size: 28px;
        line-height: 1.35;
        font-weight: 600;
        color: var(--muted);
      }
      .url {
        display: inline-block;
        margin-top: 36px;
        padding: 12px 22px;
        border-radius: 999px;
        background: var(--makan);
        color: white;
        font-size: 26px;
        font-weight: 800;
      }
      .plate {
        position: relative;
        height: 510px;
      }
      .plate img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 42% 50%;
        border-radius: 36px;
      }
      .tag {
        position: absolute;
        padding: 8px 14px;
        border-radius: 14px;
        background: oklch(0.22 0.012 85 / 0.86);
        color: white;
        font-size: 20px;
        font-weight: 700;
        white-space: nowrap;
      }
      .tag span {
        font-weight: 500;
        opacity: 0.8;
      }
      .total {
        position: absolute;
        left: -40px;
        bottom: 28px;
        padding: 18px 24px;
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 12px 32px oklch(0.22 0.012 85 / 0.18);
      }
      .total b {
        display: block;
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }
      .total b small {
        font-size: 22px;
        font-weight: 700;
        color: var(--muted);
      }
      .total p {
        margin-top: 4px;
        font-size: 19px;
        font-weight: 600;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <div>
      <img class="logo" src="../public/brand/logo.svg" alt="" />
      <h1 style="font-size: 56px">Count the kcal from chicken rice to kopi</h1>
      <p class="lead">Photo your hawker plate, get the kcal and macros in seconds.</p>
      <div class="url">joyorogo.com/sg</div>
    </div>
    <div class="plate">
      <img src="chicken-rice.jpg" alt="" style="object-position: 50% 50%" />
      <div class="tag" style="left: 110px; top: 250px">White rice <span>200 g · 260 kcal</span></div>
      <div class="tag" style="right: 20px; top: 70px">Roasted chicken <span>150 g · 330 kcal</span></div>
      <div class="tag" style="left: 140px; top: 120px">Clear soup <span>30 kcal</span></div>
      <div class="total">
        <b>691 <small>kcal</small></b>
        <p>Protein 43 g · Carbs 66 g · Fat 27 g</p>
      </div>
    </div>
  </body>
</html>
