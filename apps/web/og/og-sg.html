<!doctype html>
<!-- Source of public/og-sg.png (1200×630), the share card of /sg. Regenerate with `bun run og:sg` in apps/web.
     Dish rows are rows of packages/api/src/lib/myfcd-dishes.ts (typical portion x kcal per 100 g, HPB SG FoodID). -->
<html lang="en-SG">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Plus Jakarta Sans";
        font-weight: 200 800;
        src: url("../node_modules/@fontsource-variable/plus-jakarta-sans/files/plus-jakarta-sans-latin-wght-normal.woff2")
          format("woff2");
      }
      :root {
        --background: oklch(0.975 0.008 85);
        --foreground: oklch(0.22 0.012 85);
        --muted: oklch(0.5 0.014 85);
        --card: oklch(1 0 0);
        --makan: oklch(0.52 0.13 152);
        --makan-soft: oklch(0.95 0.035 152);
        --track: oklch(0.93 0.01 85);
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-columns: 1fr 420px;
        gap: 48px;
        align-items: center;
        padding: 0 72px 0 80px;
        background: var(--background);
        color: var(--foreground);
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      .logo {
        height: 52px;
      }
      h1 {
        margin-top: 40px;
        font-size: 68px;
        line-height: 1.04;
        font-weight: 800;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      p {
        margin-top: 24px;
        font-size: 27px;
        line-height: 1.4;
        color: var(--muted);
        max-width: 600px;
      }
      .url {
        margin-top: 36px;
        font-size: 24px;
        font-weight: 700;
        color: var(--makan);
      }
      .card {
        padding: 26px 28px 22px;
        border-radius: 28px;
        background: var(--card);
      }
      .head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }
      .head b {
        display: block;
        font-size: 64px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.04em;
        font-variant-numeric: tabular-nums;
      }
      .head b small {
        margin-left: 8px;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: 0;
        color: var(--muted);
      }
      .head span {
        font-size: 20px;
        font-weight: 600;
        color: var(--muted);
      }
      .tag {
        padding: 4px 14px;
        border-radius: 999px;
        background: var(--track);
      }
      ul {
        list-style: none;
        margin-top: 22px;
        padding: 0;
        border-radius: 22px;
        background: var(--background);
      }
      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 22px;
      }
      li + li {
        border-top: 2px solid var(--card);
      }
      li b {
        display: block;
        font-size: 28px;
        font-weight: 700;
      }
      li span {
        font-size: 19px;
        font-weight: 500;
        color: var(--muted);
      }
      li i {
        font-style: normal;
        font-size: 28px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .src {
        margin-top: 16px;
        max-width: none;
        font-size: 18px;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div>
      <img class="logo" src="../public/brand/logo.svg" alt="" />
      <h1>Count the kcal from chicken rice to kopi</h1>
      <p>Photo your hawker plate, get the kcal in seconds. Photos are not kept.</p>
      <div class="url">joyorogo.com/sg</div>
    </div>
    <div class="card">
      <div class="head">
        <div><span>Scan result</span><b>569<small>kcal</small></b></div>
        <span class="tag">Example</span>
      </div>
      <ul>
        <li>
          <div><b>Kaya toast</b><span>94 g</span></div>
          <i>376 kcal</i>
        </li>
        <li>
          <div><b>Kopi</b><span>250 g</span></div>
          <i>193 kcal</i>
        </li>
        </ul>
      <p class="src">Values: HPB SG FoodID, one ordinary serving. An estimate, editable.</p>
    </div>
  </body>
</html>
